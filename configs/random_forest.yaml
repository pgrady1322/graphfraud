# GraphFraud — Random Forest Baseline Configuration
# ═══════════════════════════════════════════════════════════════════════

model:
  type: random_forest
  params:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
    resample: true
    max_majority: 30000

data:
  data_dir: data/

output:
  dir: trained_models/
