# ═══════════════════════════════════════════════════════════════════════
# GraphFraud — GATv2Conv Configuration
# ═══════════════════════════════════════════════════════════════════════

model:
  type: gatv2
  params:
    hidden_channels: 32
    heads: 8
    num_layers: 3
    dropout: 0.3

training:
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0005
  patience: 20
  use_focal_loss: true
  focal_gamma: 2.0
  seed: 42

data:
  data_dir: data/
  train_timesteps: [1, 34]
  val_timesteps: [35, 42]
  test_timesteps: [43, 49]

output:
  dir: trained_models/
