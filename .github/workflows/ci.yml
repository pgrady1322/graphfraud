# ═══════════════════════════════════════════════════════════════════════
# GraphFraud — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════
# Runs linting (ruff) and tests (pytest) on every push/PR to main.
# GNN tests are skipped if torch_geometric is not installed.
# ═══════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show dependency versions
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import sklearn; print('scikit-learn', sklearn.__version__)"
          python -c "import xgboost; print('xgboost', xgboost.__version__)"
          python -c "import networkx; print('networkx', networkx.__version__)"

      - name: Lint with ruff
        run: |
          ruff check graphfraud/ tests/

      - name: Format check with ruff
        run: |
          ruff format --check graphfraud/ tests/

      - name: Run tests (core — no GNN deps)
        run: |
          python -m pytest tests/test_dataset.py tests/test_resampling.py -v --tb=long

  gnn-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with GNN)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.5.0+cpu.html
          pip install -e ".[dev]"

      - name: Show GNN dependency versions
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import torch_geometric; print('torch_geometric', torch_geometric.__version__)"

      - name: Run GNN model tests
        run: |
          python -m pytest tests/test_models.py -v --tb=long
